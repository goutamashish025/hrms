<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>Employee</th>
      <th>Type</th>
      <th>Dates</th>
      <th>Status</th>
      <th>Action</th> <!-- ✅ NEW -->
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let r of requests">
      <td>{{ r.employeeName }}</td>
      <td>{{ r.leaveType }}</td>
      <td>{{ r.startDate }} - {{ r.endDate }}</td>
      <td>{{ r.status }}</td>

      <td>
        @if (r.status === 'PENDING') {
          <button class="btn btn-success btn-sm me-2"
                  (click)="approve(r.id)">
            Approve
          </button>
        }

        @if (r.status === 'PENDING') {
          <button class="btn btn-danger btn-sm"
                  (click)="reject(r.id)">
            Reject
          </button>
        }
      </td>
    </tr>
  </tbody>
</table>
