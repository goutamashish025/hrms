<table class="table table-bordered">
  <thead>
    <tr>
      <th>Employee</th>
      <th>Type</th>
      <th>Dates</th>
      <th>Status</th>
      <th>Reason</th> <!-- ✅ NEW -->
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let req of requests">

      <!-- Employee -->
      <td>
        {{ req.employeeName 
           || (req.employee?.firstName + ' ' + req.employee?.lastName) }}
      </td>

      <!-- Type -->
      <td>{{ req.leaveType || req.type }}</td>

      <!-- Dates -->
      <td>
        {{ req.startDate 
            ? (req.startDate + ' - ' + req.endDate) 
            : req.date }}
      </td>

      <!-- Status -->
      <td>{{ req.status }}</td>

      <!-- ✅ Reason -->
      <td style="max-width:200px; white-space: nowrap; overflow: auto; ">
        {{ req.reason || '-' }}
        </td>

      <!-- Action -->
      <td>
        <button (click)="approve(req.id)" class="btn btn-success btn-sm">Approve</button>
        <button (click)="reject(req.id)" class="btn btn-danger btn-sm">Reject</button>
      </td>

    </tr>
  </tbody>
</table>
