<div class="content-wrapper">

  <div class="card shadow-sm p-3">
    <h4 class="mb-3">My Leaves</h4>

    <div class="table-responsive">
      <table class="table table-striped align-middle">

        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>From</th>
            <th>To</th>
            <th>Total Days</th>
            <th>Reason</th>
            <th>Status</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>

       <tbody>
  <tr *ngFor="let leave of pagedLeaves">

    <td>{{ leave.id }}</td>
    <td>{{ leave.startDate }}</td>
    <td>{{ leave.endDate }}</td>
    <td>{{ leave.totalDays }}</td>
    <td>{{ leave.reason }}</td>

    <!-- STATUS -->
    <td>
      <span class="status-badge"
        [ngClass]="{
          'pending': leave.status === 'PENDING',
          'approved': leave.status === 'APPROVED',
          'rejected': leave.status === 'REJECTED',
          'cancelled': leave.status === 'CANCELLED'
        }">
        {{ leave.status }}
      </span>
    </td>

    <!-- ACTION -->
    <td class="text-center">
      <button 
        *ngIf="leave.status === 'PENDING'"
        class="btn btn-sm btn-outline-danger"
        (click)="cancelLeave(leave.id)">
        Cancel
      </button>
    </td>

  </tr>
</tbody>

      </table>
      <div class="d-flex justify-content-between align-items-center mt-3 px-2">

  <!-- Previous -->
  <button class="btn btn-sm btn-outline-secondary"
          (click)="prevPage()" 
          [disabled]="currentPage === 1">
    ← Previous
  </button>

  <!-- Page Info -->
  <span class="fw-bold">
    Page {{ currentPage }} of {{ totalPages }}
  </span>

  <!-- Next -->
  <button class="btn btn-sm btn-outline-secondary"
          (click)="nextPage()" 
          [disabled]="currentPage === totalPages">
    Next →
  </button>

</div>
    </div>

  </div>

</div>
