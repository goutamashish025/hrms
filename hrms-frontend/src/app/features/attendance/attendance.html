<div class="content-wrapper">

  <div class="card p-3 shadow-sm">
    <h4 class="mb-3">Attendance</h4>

    <!-- ACTION BUTTONS -->
    <div class="mb-3">

      <button class="btn btn-success me-2"
              (click)="checkIn()"
              [disabled]="todayRecord?.checkIn">
        Check In
      </button>

      <button class="btn btn-danger"
              (click)="checkOut()"
              [disabled]="!todayRecord || todayRecord?.checkOut">
        Check Out
      </button>

    </div>

    <!-- TODAY STATUS -->
    <div class="mb-3" *ngIf="todayRecord">
      <strong>Today:</strong>
      In: {{ todayRecord.checkIn || '-' }} |
      Out: {{ todayRecord.checkOut || '-' }} |
      Status: {{ todayRecord.status }}
    </div>

    <!-- MONTH FILTER -->
    <div class="mb-3">
      <label class="form-label me-2">Month:</label>
      <select class="form-select w-auto d-inline-block"
              [(ngModel)]="selectedMonth"
              (ngModelChange)="onMonthChange()">
        <option *ngFor="let m of availableMonths" [value]="m">{{ monthLabel(m) }}</option>
      </select>
    </div>

    <!-- TABLE -->
    <div class="table-responsive">
      <table class="table table-striped">

        <thead class="table-dark">
          <tr>
            <th>Date</th>
            <th>Check In</th>
            <th>Check Out</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let a of filteredAttendance">
            <td>{{ a.date }}</td>
            <td>{{ a.checkIn || '-' }}</td>
            <td>{{ a.checkOut || '-' }}</td>
            <td>{{ a.status }}</td>
          </tr>
          <tr *ngIf="filteredAttendance.length === 0">
            <td colspan="4" class="text-center text-muted">No attendance records for this month</td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>

</div>
