<div class="container-fluid vh-100">
  <div class="row h-100">
    
    <!-- Left Side (Image) -->
    <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-light">
      <img src="https://media.istockphoto.com/id/477473902/photo/tea-plantations.jpg?s=1024x1024&w=is&k=20&c=j6-hEf67UlDpxtkxCiqMRy8EGmSFLCmsnvejzp5YYUA="
           alt="Login" class="img-fluid" style="max-height: 80%; border-radius: 10px;"
            />

    </div>

    <!-- Right Side (Form) -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="card shadow p-4 w-75">
        <h2 class="text-center mb-4">Login</h2>

        <form (ngSubmit)="login()">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              id="password"
              type="password"
              class="form-control"
              [(ngModel)]="password"
              name="password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p *ngIf="errorMessage" class="text-danger text-center mt-3">
          {{ errorMessage }}
        </p>
      </div>
    </div>

  </div>
</div>
